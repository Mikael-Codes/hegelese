name: Language and package checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: Build installable wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Install wheel
        run: python -m pip install --no-deps dist/hegelese-*.whl
      - name: Smoke test installed commands away from source checkout
        working-directory: ${{ runner.temp }}
        env:
          REPOSITORY: ${{ github.workspace }}
        run: |
          hegelese --version
          hegelese run "$REPOSITORY/examples/functional.hgl"
          hegelese-gate "$REPOSITORY/pilot/workflow.hgl" --request "$REPOSITORY/pilot/request.json" --report gate-report.json
      - name: Save wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hegelese-wheel-python-${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error
