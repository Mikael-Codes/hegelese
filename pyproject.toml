[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hegelese"
version = "0.3.0"
description = "A functional language for articulated, checked finite-process developments"
authors = [{ name = "Petri Mikael Autio" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
hegelese = "hegelese:main"
hegelese-gate = "hgl_gate:main"

[project.urls]
Repository = "https://github.com/Mikael-Codes/hegelese"

[tool.setuptools]
py-modules = ["hegelese", "hgl", "hgl_gate", "hgl_lineage"]
