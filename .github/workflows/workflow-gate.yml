name: Hegelese workflow gate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: workflow-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workflow-gate:
    name: workflow-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out reviewed engine and contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: engine
          persist-credentials: false
      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check candidate against reviewed contract
        run: >-
          python -I engine/hgl_gate.py candidate/pilot/workflow.hgl
          --request engine/pilot/request.json
          --report gate-report.json --timeout 5
      - name: Retain evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workflow-gate-evidence
          path: gate-report.json
          if-no-files-found: error
          retention-days: 14
